<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stationery App - Home</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark">

  <div class="mobile-container mx-auto bg-white shadow d-flex flex-column">

    <header class="p-3 pb-2">
      <div class="d-flex align-items-center justify-content-between p-2 py-1 bg-light border border-dark rounded-pill">
        <div class="d-flex align-items-center gap-2 ps-1">
          <i class="bi bi-lightning-charge-fill text-dark fs-5"></i>
          <div>
            <div class="fw-bold text-dark lh-sm" style="font-size: 0.95rem;">5 minutes</div>
            <div class="text-muted" style="font-size: 0.75rem;">Manewada - Manewada, Nagpur, Maharshtra</div>
          </div>
        </div>
        <div class="pe-1">
          <div class="bg-secondary rounded-circle border border-dark d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
            <i class="bi bi-person-fill text-white fs-5"></i>
          </div>
        </div>
      </div>
    </header>

    <section class="px-3 pb-2">
      <div class="input-group search-pill border rounded-pill overflow-hidden">
        <input type="text" class="form-control border-0 ps-4 bg-white text-muted" placeholder="Search notebooks, pens, planners..." style="font-size: 0.9rem;">
        <button class="btn btn-dark px-3 py-2 d-flex align-items-center justify-content-center" type="button" style="border-radius: 0;">
          <i class="bi bi-search fs-6"></i>
        </button>
      </div>
    </section>

    <main class="flex-grow-1 overflow-y-auto">
      
      <img src="images/image 1.png" alt="Categories" class="w-100 d-block mb-2">

      <img src="images/Rectangle 2.png" alt="50 Off Offer" class="w-100 d-block">

      <a href="page2.html" class="d-block clickable-banner">
        <img src="images/Rectangle 3348.png" alt="Books and Gel pens" class="w-100 d-block">
      </a>

      <img src="images/Rectangle 3349.png" alt="Geometry Tools" class="w-100 d-block">

      <img src="images/Rectangle 3350.png" alt="Art and Craft Supplies" class="w-100 d-block">

      <img src="images/Rectangle 3351.png" alt="Office and Desk Essentials" class="w-100 d-block">

    </main>

    <footer class="w-100">
      <img src="images/bottom nav.png" alt="Bottom Navigation" class="w-100 d-block">
    </footer>

  </div>

</body>
</html>
