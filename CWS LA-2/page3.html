<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #212529;
    }

    .mobile-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      min-height: 750px;
      background-color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .cart-bg-blur {
      filter: blur(5px) brightness(0.65);
      pointer-events: none;
      user-select: none;
    }

    .page2-header {
      background-color: #7B7EF6;
    }

    .tagline-pill {
      background-color: #C9D11D;
      color: #C9D11D;
      font-weight: 800;
      font-size: 1rem;
      -webkit-text-stroke: 1px #000;
      text-shadow: 2px 2px 0px #000;
    }

    .product-img {
      height: 155px;
      object-fit: cover;
    }

    .product-title {
      font-size: 0.8rem;
      color: #222;
    }

    .product-price {
      font-size: 0.9rem;
      color: #000;
    }

    .cart-sheet {
      background-color: #FBF6EE;
      border-radius: 28px 28px 0 0;
      height: 55%;
      z-index: 10;
    }

    .cart-title-img {
      height: 36px;
      width: auto;
    }

    .cart-close-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .cart-product-img {
      width: 185px;
      height: 175px;
      object-fit: cover;
    }

    .cart-product-name {
      font-size: 1rem;
      color: #111;
    }

    .cart-checkout-btn {
      background: url('images/Rectangle 3368.png') no-repeat center/100% 100%;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 500;
      width: 78%;
      height: 52px;
      border: none;
    }

    .cart-checkout-btn:hover {
      opacity: 0.9;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="mobile-container mx-auto shadow">

    <div class="cart-bg-blur">
      <header class="page2-header p-3 pb-4">
        <div class="mb-2">
          <img src="images/images-removebg-preview 1.png" alt="" style="width: 28px; height: auto;">
        </div>
        <div class="text-center px-2">
          <div class="tagline-pill d-inline-block px-3 py-2 rounded-pill">
            connecting you &nbsp; more &nbsp; faster !!
          </div>
        </div>
      </header>

      <div class="p-3">
        <div class="row g-3">
          <div class="col-6">
            <div class="card rounded-3 overflow-hidden">
              <img src="images/pro1.png" class="card-img-top product-img" alt="Hardcover Journal XL">
              <div class="card-body p-2">
                <p class="product-title mb-1">Hardcover Journal XL</p>
                <p class="product-price fw-bold mb-2">₹10 • In stock</p>
                <div class="fs-6">🛒 💖</div>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="card rounded-3 overflow-hidden">
              <img src="images/unsplash_oJG9HOVKGMs.png" class="card-img-top product-img" alt="">
              <div class="card-body p-2">
                <p class="product-title mb-1">Fine Gel Pen (0.5mm)</p>
                <p class="product-price fw-bold mb-2">₹99.98</p>
                <div class="fs-6">🛒 💖</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="cart-sheet position-absolute bottom-0 start-0 w-100 d-flex flex-column align-items-center justify-content-center px-4 py-3">

      <div class="w-100 position-relative text-center mb-3">
        <img src="images/My Cart.png" alt="My Cart" class="cart-title-img">
        <a href="page2.html" class="position-absolute top-50 end-0 translate-middle-y" aria-label="Close Cart">
          <img src="images/❌.png" alt="Close" class="cart-close-img">
        </a>
      </div>

      <img src="images/unsplash_oJG9HOVKGMs.png" alt="Fine Gel pen (0.5)" class="cart-product-img mb-2">

      <p class="cart-product-name mb-4">Fine Gel pen (0.5)</p>

      <button type="button" class="btn cart-checkout-btn">
        Checkout
      </button>

    </div>

  </div>

</body>
</html>
